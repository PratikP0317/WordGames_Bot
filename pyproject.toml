[project]
name = "wordgames-bot"
version = "0.1.0"
description = "A trie-powered 4x4 Word Hunt solver with calibrated mouse playback"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.1",
    "pillow>=11.0.0",
    "pynput>=1.7.7",
]

[project.scripts]
word-hunt-bot = "wordgames_bot.main:main"
word-hunt-calibrate = "wordgames_bot.calibration:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wordgames_bot"]
